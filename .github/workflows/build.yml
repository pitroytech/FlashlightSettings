name: Build rootless deb

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Theos, rootless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl fakeroot git perl unzip zip xz-utils

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1

      # The Makefile asks for the 15.5 SDK, which theos/sdks does not carry.
      # Any SDK from 15 up builds this fine, so pick the newest one available
      # and keep the 15.0 deployment target.
      - name: Pick an iPhoneOS SDK
        run: |
          set -eu
          sdk="$(ls -d "$THEOS"/sdks/iPhoneOS1[5-9]*.sdk 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$sdk" ]; then
            echo "No suitable SDK installed, fetching iPhoneOS16.5.sdk from theos/sdks"
            mkdir -p "$THEOS/sdks"
            curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
            unzip -q /tmp/sdks.zip -d /tmp/sdks
            cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
            sdk="$THEOS/sdks/iPhoneOS16.5.sdk"
          fi
          version="$(basename "$sdk" .sdk)"
          version="${version#iPhoneOS}"
          echo "Using $sdk"
          echo "SDK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Ensure ldid is on PATH
        run: |
          set -eu
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already on PATH: $(command -v ldid)"
            exit 0
          fi
          found="$(find "$THEOS" -type f -name 'ldid*' -perm -u+x 2>/dev/null | head -n 1 || true)"
          if [ -n "$found" ]; then
            sudo ln -sf "$found" /usr/local/bin/ldid
          else
            sudo curl -fsSL -o /usr/local/bin/ldid \
              https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
            sudo chmod +x /usr/local/bin/ldid
          fi
          command -v ldid

      - name: Build package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:$SDK_VERSION:15.0

      - name: Inspect produced package
        run: |
          set -eu
          deb="$(ls packages/*.deb | head -n 1)"
          echo "Package: $deb"
          dpkg-deb -I "$deb"
          echo "--- contents ---"
          dpkg-deb -c "$deb"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashlightsettings-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
